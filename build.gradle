plugins { id 'java' }

repositories {
	maven { url = 'https://repo.runelite.net' }
	mavenCentral()
}

def runeLiteVersion = '1.13.8'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation 'junit:junit:4.13.2'
	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
}

group = 'com.brandon.music2008'
version = '1.0.0'

sourceSets {
	main { java { setSrcDirs(['src/main/java']) }; resources { setSrcDirs(['src/main/resources']) } }
	test { java { setSrcDirs(['src/test/java']) } }
}

tasks.named('test') { useJUnit(); maxHeapSize = '1g' }

tasks.withType(JavaCompile) {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

def runeLiteJava = "C:/Users/brrad/AppData/Local/RuneLite/jre/bin/javaw.exe"
def runeLiteJar  = "C:/Users/brrad/AppData/Local/RuneLite/RuneLite.jar"

tasks.register('runClient', JavaExec) {
	dependsOn jar
	group = 'runelite'
	description = 'Launch RuneLite with this plugin loaded via --classpath'

	executable = runeLiteJava
	classpath = files()   // JavaExec classpath unused; launcher handles it
	mainClass  = '-jar'   // triggers -jar mode via args below

	args runeLiteJar,
		 '--developer-mode',
		 '--classpath', jar.archiveFile.get().asFile.absolutePath

	jvmArgs '-Djava.awt.headless=false'
}
